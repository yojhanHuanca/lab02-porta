databases:
  - name: lab02-db
    plan: free
    databaseName: lab02
    user: lab02

services:
  - type: web
    runtime: node
    name: lab02-api
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lab02-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://lab-02-angular.onrender.com

  - type: web
    runtime: static
    name: lab-02-angular
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/lab-02/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
